[package]
name = "raix"
version = "0.1.0"
edition = "2024"

[dependencies]
calloop = "0.14"
calloop-wayland-source = "0.4"

fuzzy-matcher = "0.3"
rayon = "1.10"

serde = { version = "1", features = ["derive"] }
toml = "0.9"

fontdue = "0.9"
libc = "0.2"

smithay-client-toolkit = "0.20"
wayland-client = "0.31"

image = { version = "0.25", default-features = false, features = [
    "png",
    "ico",
    "jpeg",
    "webp",
] }

freedesktop = "0.0.3"

[workspace]